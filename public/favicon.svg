  <line x1="10" y1="14" x2="20" y2="14" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10" y1="17" x2="18" y2="17" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  <line x1="10" y1="20" x2="14" y2="20" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- AI Spark / Checkmark Badge Background -->
